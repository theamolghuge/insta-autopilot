name: AI news

# AI news page. Every 3 hours a Claude scheduled task picks the story, writes the post and pushes a
# brief to content/ai.news.daily/briefs/ (see generator/ai-news/CLAUDE_TASK.md). That push starts this
# workflow, which fetches the article image, renders the slides in the brand, commits and publishes.
# The cron below is only a safety net: if no post went out in the last 2.5 h, it makes one by itself.
# Only touches the AI news account. fin.ance18 keeps running from publish.yml as before.

on:
  push:
    branches: [main]
    paths: ["content/ai.news.daily/briefs/**"]
  schedule:
    - cron: "57 */3 * * *"     # 00:57, 03:57 ... UTC: 45 min after the Claude task (:12), only acts if it didn't post
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = make + post now, preview = make only and attach images to the run (nothing committed or posted), make-only = make and commit, post on the next run"
        type: choice
        options: [normal, preview, make-only]
        default: normal
      format:
        description: "Force a format (leave empty to follow the rotation)"
        type: choice
        options: ["", single, carousel, video, text]
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-news              # own group: never cancelled by the 15-minute publish runs
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: ffmpeg (for Reels)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Is the account switched on?
        id: acc
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          acc = json.load(open("generator/ai-news/config.json"))["account_id"]
          cfg = next((a for a in json.load(open("accounts.json"))["accounts"] if a["id"] == acc), {})
          print(f"id={acc}")
          print(f"enabled={'true' if cfg.get('enabled') else 'false'}")
          EOF

      - name: Make preview (no commit, no post)
        if: inputs.mode == 'preview' || steps.acc.outputs.enabled != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, only used by the safety net
        run: |
          if [ "${{ steps.acc.outputs.enabled }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Account ${{ steps.acc.outputs.id }} is not enabled in accounts.json; skipping." ; exit 0
          fi
          F="${{ inputs.format }}"
          python generator/ai-news/make_post.py --out out/ai-news-preview ${F:+--format $F}
          cat out/ai-news-preview/caption.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'preview' || steps.acc.outputs.enabled != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-preview
          path: out/ai-news-preview/
          if-no-files-found: ignore
          retention-days: 3

      - name: Make the post
        id: make
        if: steps.acc.outputs.enabled == 'true' && inputs.mode != 'preview'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, only used by the safety net
        run: |
          F="${{ inputs.format }}"
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then EXTRA="--fallback"; fi
          python generator/ai-news/make_post.py $EXTRA ${F:+--format $F}

      # Images and videos never go on main (they'd make the repo grow forever). The new post's files are
      # committed alone to the `media` branch, which is replaced every run, and served by jsDelivr
      # with the right content type (raw.githubusercontent.com labels .mp4 as a generic download).
      - name: Host media
        if: steps.acc.outputs.enabled == 'true' && inputs.mode != 'preview'
        run: |
          mapfile -t V < <(find "content/${{ steps.acc.outputs.id }}/queue" \( -name '*.jpg' -o -name '*.mp4' \) 2>/dev/null)
          if [ ${#V[@]} -eq 0 ]; then echo "no new media"; exit 0; fi
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/media-index"
          git update-index --add -- "${V[@]}"
          C=$(git commit-tree "$(git write-tree)" -m "AI news media [skip ci]")
          unset GIT_INDEX_FILE
          git push -q -f origin "$C:refs/heads/media"
          BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$C"
          echo "MEDIA_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "VIDEO_BASE_URL=$BASE" >> "$GITHUB_ENV"
          for v in "${V[@]}"; do            # warm the CDN and check it serves the right type
            for i in 1 2 3 4 5 6; do
              T=$(curl -sIL "$BASE/$v" | grep -i '^content-type' | tail -1)
              echo "$v -> $T"; echo "$T" | grep -qiE 'video/mp4|image/jpeg' && break; sleep 10
            done
          done

      - name: Commit the post
        id: commit
        if: steps.acc.outputs.enabled == 'true' && inputs.mode != 'preview'
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add -A "content/${{ steps.acc.outputs.id }}"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "AI news: new post [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          if git status -sb | head -1 | grep -q ahead; then echo "push failed"; exit 1; fi

      # Posts the waiting item: the one just made, or one a previous run failed to post
      # (make_post.py throws posts away once they are 6 h old, so nothing stale goes out).
      - name: Publish it now
        id: pub
        if: steps.acc.outputs.enabled == 'true' && inputs.mode != 'preview' && inputs.mode != 'make-only'
        env:
          IG_TOKEN_FIN_ANCE18: ${{ secrets.IG_TOKEN_FIN_ANCE18 }}
          IG_TOKEN_AI_NEWS_DAILY: ${{ secrets.IG_TOKEN_AI_NEWS_DAILY }}
        run: python scripts/publish.py --force --account "${{ steps.acc.outputs.id }}"   # media URLs from "Host media"

      - name: Save posting state
        if: always() && steps.pub.outputs.changed == 'true'
        run: |
          git add state
          git commit -m "Update posting state [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
